<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resources • RoboCodex</title>
  <link rel="stylesheet" href="css/modern.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <a class="brand" href="index.html"><img src="images/logo.png" alt="RoboCodex Logo" class="brand-logo"><span>RoboCodex</span></a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="content.html">Videos</a>
        <a href="guides.html">Guides</a>
        <a class="active" href="resources.html">Resources</a>
        <a href="about.html">About</a>
      </nav>
      <div class="header-actions">
        <button id="theme-toggle" class="btn btn-ghost" type="button" aria-label="Switch color theme"><i class="fa-solid fa-moon"></i></button>
        <a class="btn btn-primary" href="content.html">Explore Videos</a>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-title">
        <div>
          <div class="badge">Resources</div>
          <h1>Curated FTC resources</h1>
          <p class="muted">A growing directory of official FIRST material, technical docs, hardware vendors, programming tools, and community libraries.</p>
        </div>
      </div>
      <div class="filter-bar">
        <p id="resource-count" class="muted" style="margin:0; align-self:center;">Loading resources…</p>
        <select id="resource-category" aria-label="Filter resources by category">
          <option value="All">All categories</option>
        </select>
      </div>
      <div id="resource-grid" class="feature-grid"></div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
