<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarks • RoboCodex</title>
  <link rel="stylesheet" href="css/modern.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <a class="brand" href="index.html"><img src="images/logo.png" alt="RoboCodex Logo" class="brand-logo"><span>RoboCodex</span></a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="content.html">Videos</a>
        <a href="guides.html">Guides</a>
        <a href="resources.html">Resources</a>
        <a href="about.html">About</a>
      </nav>
      <div class="header-actions">
        <button id="theme-toggle" class="btn btn-ghost" type="button" aria-label="Switch color theme"><i class="fa-solid fa-moon"></i></button>
        <a class="btn btn-primary" href="content.html">Explore Videos</a>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-title">
        <div>
          <div class="badge">Bookmarks</div>
          <h1>Saved videos and resources</h1>
          <p class="muted">Bookmarks are stored locally in your browser so they work without sign-in.</p>
        </div>
        <button id="clear-bookmarks" class="btn btn-secondary" type="button">Clear saved data</button>
      </div>
      <div id="bookmark-list"></div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
